name: Pawnlog
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: W7Q885Q59C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pawnlog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pawnlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pawntrack
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: W7Q885Q59C
    info:
      path: Pawnlog/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  PawnlogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PawnlogTests
    dependencies:
      - target: Pawnlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pawntrack.tests
        DEVELOPMENT_TEAM: W7Q885Q59C
  PawnlogUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PawnlogUITests
    dependencies:
      - target: Pawnlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.pawntrack.uitests
        DEVELOPMENT_TEAM: W7Q885Q59C
schemes:
  Pawnlog:
    build:
      targets:
        Pawnlog: all
    test:
      targets:
        - PawnlogTests
        - PawnlogUITests
    run:
      config: Debug
